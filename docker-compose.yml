services:
  proton:
    build: .
    container_name: proton-proxy
    ports:
      # 8100 is rotating; each selected OpenVPN/WireGuard profile gets 8101, 8102, …
      - "0.0.0.0:8100-8200:8100-8200"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      BASE_PROXY_PORT: ${BASE_PROXY_PORT:-8100}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-0}
      PORT_GAP: ${PORT_GAP:-1}
    volumes:
      - ./ovpn_configs:/etc/openvpn/configs:ro
      - ./.user_data:/.user_data
    restart: unless-stopped
